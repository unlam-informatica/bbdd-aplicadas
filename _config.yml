title: Bases de Datos Aplicadas
description: Apuntes, ejercicios y material de cursada — UNLaM

remote_theme: just-the-docs/just-the-docs

url: https://unlam-informatica.github.io
baseurl: /bbdd-aplicadas
favicon_ico: "/assets/favicon/favicon.ico"

color_scheme: unlam

search_enabled: true
heading_anchors: true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default

callouts_level: quiet
callouts:
  note:
    title: Nota
    color: blue
  important:
    title: Importante
    color: yellow
  warning:
    title: Atención
    color: red
  enunciado:
    title: Enunciado
    color: amber
  resolucion:
    title: Resolución
    color: teal

aux_links:
  "GitHub":
    - "https://github.com/unlam-informatica/bbdd-aplicadas"

exclude:
  - CLAUDE.md
  - AGENTS.md
  - reference/
  - template/

mermaid:
  version: "10.6.1"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
